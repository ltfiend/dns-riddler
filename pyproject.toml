[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dns-riddler"
version = "0.1.0"
description = "A text-based DNS riddle/quiz game — RFC trivia, dig output forensics, and packet-capture analysis"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Peter" }]
keywords = ["dns", "quiz", "game", "networking", "interview"]
dependencies = ["rich>=13"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
dns-riddler = "dns_riddler.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dns_riddler"]
